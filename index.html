<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Climatic Registry for Enterprises · Piloto gratuito</title>
<meta name="description" content="Registro climático por ubicación, con fecha y hora, para empresas del agro, la industria y la logística. Piloto gratuito de 14 días.">
<meta property="og:title" content="Climatic Registry for Enterprises · Piloto gratuito">
<meta property="og:description" content="Registrá el clima de tu campo o planta con fecha y hora y recibí un reporte. Piloto gratuito de 14 días.">
<meta name="theme-color" content="#ffffff">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{serif:['"Times New Roman"','Times','Georgia','serif']}}}};
</script>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:#FFFFFF;min-height:100%}
body{font-family:"Times New Roman",Times,Georgia,serif;color:#111;-webkit-font-smoothing:antialiased}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #111;outline-offset:2px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState}=React;
const html=htm.bind(React.createElement);

/* ---------- Configuración del piloto ---------- */
const WA_NUMBER='5491130107055';
const JOIN_TEXT='Hola, quiero sumarme al piloto de 14 días de Climatic Registry for Enterprises.';
const SHARE_TEXT='Climatic Registry for Enterprises: registro climático por ubicación, con fecha y hora. Piloto gratuito de 14 días.';
const share=()=>{const url=location.href;
  if(navigator.share){navigator.share({title:'Climatic Registry for Enterprises',text:SHARE_TEXT,url}).catch(()=>{})}
  else{window.open('https://wa.me/?text='+encodeURIComponent(SHARE_TEXT+' '+url),'_blank','noopener')}};

/* ---------- Formato ---------- */
const nf=(n,d=1)=>n.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pad=(n)=>String(n).padStart(2,'0');
const stamp=(d)=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+', '+pad(d.getHours())+':'+pad(d.getMinutes());
const titleCase=(s)=>s.trim().replace(/\s+/g,' ').split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');

/* ---------- Capa de datos (demostración) ----------
   En tu app real, reemplazá api.consultar por una llamada a tu backend, por ejemplo:
   const r = await fetch('/api/clima?ciudad='+encodeURIComponent(city)); return r.json();
   (el backend consulta OpenWeatherMap, guarda en PostgreSQL y devuelve el registro). */
const DEMO={
  'buenos aires':{desc:'cielo claro',temp:24.8,feels:25,min:24,max:26,pres:1018,hum:37,rain:0,wind:1.4}
};
const api={consultar:(city)=>new Promise(res=>setTimeout(()=>{
  const b=DEMO[city.trim().toLowerCase()];
  res(b?{...b,name:titleCase(city)+', AR',saved:stamp(new Date())}:null)},800))};
const INIT_RES={...DEMO['buenos aires'],name:'Buenos Aires, AR',saved:'09/11/2026, 15:07'};
const INIT_HIST=[
  {id:2,date:'09/11/2026, 15:07',loc:'Buenos Aires, AR',temp:24.8,hum:37,rain:0,wind:1.4},
  {id:1,date:'09/11/2026, 14:45',loc:'Buenos Aires, AR',temp:24.3,hum:39,rain:0,wind:0.9}
];

/* ---------- Piezas ---------- */
const Card=({children})=>html`<section className="bg-white border border-[#E5E5E5] rounded-3xl p-5 sm:p-6">${children}</section>`;
const Head=({title,sub,right})=>html`<div className="flex items-start justify-between gap-4"><div><h2 className="text-[21px] leading-tight">${title}</h2><p className="text-[16px] text-[#6B6B6B] mt-1.5">${sub}</p></div>${right||null}</div>`;
const JoinBtn=({light,rubro})=>WA_NUMBER?html`<a href=${'https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(JOIN_TEXT+(rubro?' Mi rubro: '+rubro+'.':''))} target="_blank" rel="noopener" className=${'inline-flex items-center justify-center h-11 px-5 rounded-xl text-[16px] '+(light?'bg-white text-[#111] active:bg-[#EEE]':'bg-[#1A1A1A] text-white active:bg-[#333]')}>Sumarme al piloto</a>`:null;
const ShareBtn=({light})=>html`<button type="button" onClick=${share} className=${'inline-flex items-center justify-center h-11 px-5 rounded-xl text-[16px] border '+(light?'border-white/35 text-white active:bg-white/10':'border-[#D4D4D0] text-[#111] active:bg-[#F4F4F2]')}>Compartir</button>`;

const RUBROS={Agro:{bg:'#CFE6D8',fg:'#24493A'},Industria:{bg:'#F2DDB0',fg:'#6B4A0E'},'Logística':{bg:'#CFDDE9',fg:'#2F4C63'}};
function Banner(){
  const [rubro,setRubro]=useState(null);
  return html`<section className="rounded-3xl bg-[#1A1A1A] text-white p-5 sm:p-6">
    <div className="flex flex-wrap items-center justify-between gap-5">
      <div className="max-w-[560px]">
        <span className="text-[13px] tracking-[0.12em] uppercase text-[#D4D1CB]">Piloto gratuito · 14 días</span>
        <h2 className="text-[26px] sm:text-[28px] leading-tight mt-1.5">Registrá el clima de tu campo o planta</h2>
        <p className="text-[16.5px] text-[#D4D4D8] mt-2">Guardamos las condiciones de tu ubicación con fecha y hora y te enviamos un reporte al final.</p>
        <div className="flex flex-wrap items-center gap-2 mt-3"><span className="text-[13.5px] text-[#A1A1AA] mr-1">Elegí tu rubro</span>${Object.keys(RUBROS).map(t=>{const c=RUBROS[t];const on=rubro===t;return html`<button key=${t} type="button" aria-pressed=${on} onClick=${()=>setRubro(on?null:t)} className="text-[14.5px] px-3 py-1 rounded-full border transition-colors" style=${on?{background:c.bg,color:c.fg,borderColor:c.bg,fontWeight:700}:{background:'transparent',color:c.bg,borderColor:c.bg+'66'}}>${t}</button>`})}</div>
      </div>
      <div className="flex flex-wrap gap-2.5"><${JoinBtn} light=${true} rubro=${rubro}/><${ShareBtn} light=${true}/></div>
    </div>
  </section>`;
}

function Consulta({onSaved}){
  const [q,setQ]=useState('Buenos Aires');
  const [busy,setBusy]=useState(false);
  const [res,setRes]=useState(INIT_RES);
  const [unknown,setUnknown]=useState(null);
  const [note,setNote]=useState('Última consulta guardada en este equipo, del 09/11/2026, 15:07. Consultá de nuevo para actualizarla.');
  const run=async()=>{const c=q.trim();if(!c||busy)return;setBusy(true);
    const r=await api.consultar(c);
    if(!r){setUnknown(titleCase(c));setNote('Esta ubicación todavía no está en la demostración.')}
    else{setUnknown(null);setRes(r);setNote('Última consulta guardada en este equipo, del '+r.saved+'. Consultá de nuevo para actualizarla.');onSaved(r)}
    setBusy(false)};
  return html`<${Card}>
    <${Head} title="Consultar clima" sub="Cada consulta queda registrada en el histórico." right=${html`<span className="text-[13.5px] text-[#6B6B6B] border border-[#E5E5E5] rounded-full px-2.5 py-0.5 shrink-0">Datos de ejemplo</span>`}/>
    <div className="flex gap-2.5 mt-5">
      <input aria-label="Ciudad" value=${q} onChange=${e=>setQ(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&run()} className="flex-1 min-w-0 h-12 px-4 rounded-xl border border-[#E5E5E5] bg-white text-[17px]"/>
      <button type="button" onClick=${run} className="h-12 px-5 rounded-xl bg-[#1A1A1A] text-white text-[17px] shrink-0 active:bg-[#333]">${busy?'Consultando…':'Consultar'}</button>
    </div>
    <p aria-live="polite" className="text-[15.5px] text-[#6B6B6B] mt-5">${note}</p>
    ${unknown?html`<div className="mt-5 rounded-2xl border border-[#E5E5E5] p-5">
      <div className="text-[20px] leading-tight">${unknown} todavía no está en la demostración</div>
      <p className="text-[16px] text-[#6B6B6B] mt-2 max-w-[560px]">La demostración muestra Buenos Aires. En el piloto registramos el clima de tu ubicación durante 14 días y te enviamos un reporte.</p>
      <div className="flex flex-wrap gap-2.5 mt-4"><${JoinBtn}/><${ShareBtn}/></div>
    </div>`:html`<div className="mt-6 flex flex-wrap items-center gap-x-8 gap-y-5 px-1">
      <div className="flex items-center gap-4">
        <span className="w-11 h-11 rounded-full bg-[#DD7452] shrink-0"></span>
        <div><div className="text-[23px] leading-tight">${res.name}</div><div className="text-[16px] text-[#6B6B6B]">${res.desc}</div></div>
      </div>
      <div className="text-[64px] leading-none">${Math.round(res.temp)} °C</div>
      <dl className="grid grid-cols-[auto_auto] gap-x-7 gap-y-1.5 text-[17px]">
        <dt className="text-[#6B6B6B]">Sensación térmica</dt><dd>${Math.round(res.feels)} °C</dd>
        <dt className="text-[#6B6B6B]">Mínima / Máxima</dt><dd>${Math.round(res.min)} °C / ${Math.round(res.max)} °C</dd>
        <dt className="text-[#6B6B6B]">Presión</dt><dd>${res.pres.toLocaleString('es-AR')} hPa</dd>
      </dl>
      <span className="border border-[#E5E5E5] rounded-full px-3 py-1 text-[14.5px]">Guardado el ${res.saved}</span>
    </div>`}
  <//>`;
}

function Historico({rows}){
  const avg=rows.reduce((a,r)=>a+r.temp,0)/rows.length;
  const th='font-normal py-3 ';
  return html`<${Card}>
    <${Head} title="Histórico de mediciones" sub=${rows.length+' mediciones · temperatura promedio '+nf(avg,1)+' °C'}/>
    <div className="overflow-x-auto mt-5">
      <table className="w-full min-w-[680px] text-[17px]">
        <thead><tr className="text-left border-b border-[#E5E5E5]">
          <th className=${th+'px-3'}>ID</th><th className=${th+'px-3'}>Fecha</th><th className=${th+'px-3'}>Ubicación</th>
          ${['Temp.','Humedad','Precip.','Viento','Rad.'].map(h=>html`<th key=${h} className=${th+'px-3 text-right'}>${h}</th>`)}
        </tr></thead>
        <tbody>${rows.map((r,i)=>html`<tr key=${r.id} className=${i?'border-t border-[#E5E5E5]':''}>
          <td className="py-3.5 px-3">${r.id}</td>
          <td className="py-3.5 px-3 whitespace-nowrap">${r.date}</td>
          <td className="py-3.5 px-3 whitespace-nowrap">${r.loc}</td>
          <td className="py-3.5 px-3 text-right whitespace-nowrap">${nf(r.temp,1)} °C</td>
          <td className="py-3.5 px-3 text-right whitespace-nowrap">${r.hum} %</td>
          <td className="py-3.5 px-3 text-right whitespace-nowrap">${nf(r.rain,1)} mm</td>
          <td className="py-3.5 px-3 text-right whitespace-nowrap">${nf(r.wind,1)} m/s</td>
          <td className="py-3.5 px-3 text-right text-[#A1A1AA]">—</td>
        </tr>`)}</tbody>
      </table>
    </div>
  <//>`;
}

function Unidades(){
  const [v,setV]=useState('');
  const [out,setOut]=useState(null);
  const conv=(mode)=>{const n=parseFloat(String(v).replace(',','.'));
    if(isNaN(n)){setOut('Ingresá una temperatura.');return}
    setOut(mode==='c2f'?nf(n,1)+' °C = '+nf(n*9/5+32,1)+' °F':nf(n,1)+' °F = '+nf((n-32)*5/9,1)+' °C')};
  const btn='h-11 px-4 rounded-xl bg-[#F4F4F2] text-[17px] active:bg-[#E9E9E6]';
  return html`<${Card}>
    <${Head} title="Unidades de medida" sub="Conversión entre Celsius y Fahrenheit."/>
    <input aria-label="Temperatura" inputMode="decimal" placeholder="Temperatura" value=${v} onChange=${e=>setV(e.target.value)} className="w-full h-12 px-4 mt-5 rounded-xl border border-[#E5E5E5] bg-white text-[17px] placeholder-[#8A8A8A]"/>
    <div className="flex flex-wrap gap-3 mt-4">
      <button type="button" className=${btn} onClick=${()=>conv('c2f')}>Celsius a Fahrenheit</button>
      <button type="button" className=${btn} onClick=${()=>conv('f2c')}>Fahrenheit a Celsius</button>
    </div>
    ${out?html`<p aria-live="polite" className="text-[18px] mt-4">${out}</p>`:null}
  <//>`;
}

function App(){
  const [rows,setRows]=useState(INIT_HIST);
  const onSaved=(r)=>setRows(prev=>[{id:Math.max(...prev.map(x=>x.id))+1,date:r.saved,loc:r.name,temp:r.temp,hum:r.hum,rain:r.rain,wind:r.wind},...prev]);
  return html`<main className="mx-auto w-full max-w-[980px] px-4 sm:px-6 py-10 flex flex-col gap-5">
    <header className="mb-2">
      <h1 className="text-[32px] sm:text-[38px] font-bold leading-tight">Climatic Registry for Enterprises</h1>
      <p className="text-[18px] text-[#6B6B6B] mt-1">Registro y monitoreo de datos climáticos</p>
    </header>
    <${Banner}/>
    <${Consulta} onSaved=${onSaved}/>
    <${Historico} rows=${rows}/>
    <${Unidades}/>
    <footer className="text-center text-[14px] text-[#6B6B6B] pt-2 pb-6 leading-relaxed"><p>CRFE © 2026 Bruno Vaccaro. Todos los derechos reservados.</p><p>Datos de <a href="https://openweathermap.org/" target="_blank" rel="noopener" className="underline underline-offset-2 hover:text-[#111]">OpenWeatherMap</a></p></footer>
  </main>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
